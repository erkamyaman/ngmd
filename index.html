<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>NgMd</title>
    <meta
      name="description"
      content="Modern Angular docs-site starter built on AnalogJS, Vite, and Tailwind. Drop a markdown file, get a route."
    />
    <meta property="og:title" content="NgMd" />
    <meta
      property="og:description"
      content="Modern Angular docs-site starter built on AnalogJS, Vite, and Tailwind. Drop a markdown file, get a route."
    />
    <meta property="og:image" content="/logo.svg" />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('ngmd-theme');
          var mode = stored === 'light' || stored === 'dark' ? stored : 'auto';
          var resolved =
            mode === 'auto'
              ? matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : mode;
          if (resolved === 'dark') document.documentElement.classList.add('dark');
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

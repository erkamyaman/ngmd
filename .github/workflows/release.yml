name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Check the tag matches create-ngmd's version
        run: |
          version="$(node -p "require('./create-ngmd/package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match create-ngmd version ${version}. Bump create-ngmd/package.json and tag v${version}."
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Test
        run: pnpm exec vitest run

      - name: Build
        run: pnpm build

      - name: Scaffold, install, build and test a generated site
        run: pnpm --dir create-ngmd smoke

      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@latest

      - name: Publish create-ngmd to npm
        working-directory: create-ngmd
        run: npm publish --access public

      - name: Create the GitHub release
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}

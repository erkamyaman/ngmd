name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Test
        run: pnpm exec vitest run

      - name: Build
        run: pnpm build

      - name: Scaffold, install, build and test a generated site
        run: pnpm --dir create-ngmd smoke

      - name: Scaffold, build and test a site inside an Nx workspace
        run: pnpm --dir create-ngmd smoke:nx

# Netlify deploy config for NgMd.
# Static site. The build prerenders every page (see `prerenderRoutes` in
# plugin-utils.ts), so each route has its own index.html and a refresh shows
# that page straight away.

[build]
  command = "pnpm install --frozen-lockfile && pnpm run build"
  publish = "dist/analog/public"

[build.environment]
  # Pin Node to match the engines field in package.json so dev / Netlify
  # stay aligned. Bump together when the project upgrades.
  NODE_VERSION = "22.22.3"

# Unknown paths get the prerendered not-found page with a 404 status. The
# rule only applies when no file matches, and the URL in the browser bar
# stays the same, so the Angular router renders the not-found page there too.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
